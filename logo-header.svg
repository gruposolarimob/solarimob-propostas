<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" role="img" aria-label="Grupo Solarimob">
  <!-- Sun: drawn first so roof overlaps it on the left -->
  <circle cx="42" cy="14" r="14" fill="#F0A500"/>
  <!-- Roof / house silhouette (solid white, covers left part of sun) -->
  <polygon points="2,40 2,33 27,9 52,33 52,40" fill="white"/>
  <!-- "GRUPO" — small caps above -->
  <text x="68" y="20"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="11" font-weight="700" fill="rgba(255,255,255,0.80)"
        letter-spacing="4">GRUPO</text>
  <!-- "SOLARIMOB" — bold main name -->
  <text x="68" y="41"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="800" fill="white"
        letter-spacing="0.5">SOLARIMOB</text>
</svg>
