<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Propostas | Grupo Solarimob</title>
  <style>
    :root {
      --navy: #1B3466;
      --navy-light: #254080;
      --gold: #F0A500;
      --gold-light: #FFC333;
      --white: #FFFFFF;
      --light: #F2F5FB;
      --gray: #6B7280;
      --gray-light: #E5E7EB;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--light);
      color: #1F2937;
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: white;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 2px 12px rgba(27,52,102,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 36px; height: 36px; background: var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-name { font-weight: 700; font-size: 1rem; letter-spacing: 0.5px; }
    .logo-sub { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .btn-nova { background: var(--gold); color: var(--navy); border: none; padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none; }
    .btn-nova:hover { background: var(--gold-light); transform: translateY(-1px); }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.2rem 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid var(--navy); }
    .stat-card.gold { border-left-color: var(--gold); }
    .stat-card.green { border-left-color: var(--success); }
    .stat-card.warning { border-left-color: var(--warning); }
    .stat-label { font-size: 0.75rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--navy); line-height: 1; }
    .stat-sub { font-size: 0.75rem; color: var(--gray); margin-top: 4px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .toolbar-title { font-size: 1.1rem; font-weight: 600; color: var(--navy); }
    .toolbar-right { display: flex; gap: 0.5rem; }
    .filter-btn { background: white; border: 1px solid var(--gray-light); padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; color: var(--gray); }
    .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
    .filter-btn:hover:not(.active) { border-color: var(--navy); color: var(--navy); }
    .search-input { background: white; border: 1px solid var(--gray-light); padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem; outline: none; width: 200px; transition: border 0.2s; }
    .search-input:focus { border-color: var(--navy); }
    .proposals-table { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
    .table-header { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr 1.5fr; padding: 0.75rem 1.5rem; background: var(--light); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); border-bottom: 1px solid var(--gray-light); }
    .proposal-row { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr 1.5fr; padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-light); align-items: center; transition: background 0.15s; cursor: default; }
    .proposal-row:last-child { border-bottom: none; }
    .proposal-row:hover { background: #FAFBFF; }
    .prop-name { font-weight: 600; font-size: 0.9rem; color: var(--navy); }
    .prop-file { font-size: 0.75rem; color: var(--gray); margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
    .badge-rapido { background: #FEF3C7; color: #92400E; }
    .badge-completo { background: #DBEAFE; color: #1E40AF; }
    .badge-aberto { background: #D1FAE5; color: #065F46; }
    .badge-nao-aberto { background: #F3F4F6; color: #6B7280; }
    .col-date { font-size: 0.82rem; color: var(--gray); }
    .col-actions { display: flex; gap: 0.5rem; align-items: center; }
    .action-btn { border: none; padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 600; transition: all 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-link { background: var(--navy); color: white; }
    .btn-link:hover { background: var(--navy-light); }
    .btn-copy { background: var(--light); color: var(--navy); border: 1px solid var(--gray-light); }
    .btn-copy:hover { background: var(--gray-light); }
    .btn-mark { background: #F0FDF4; color: var(--success); border: 1px solid #BBF7D0; font-size: 0.7rem; }
    .btn-mark:hover { background: #DCFCE7; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--gray); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h3 { font-size: 1.1rem; color: var(--navy); margin-bottom: 0.5rem; }
    .empty-state p { font-size: 0.85rem; max-width: 360px; margin: 0 auto; }
    .loading { text-align: center; padding: 3rem; color: var(--gray); font-size: 0.9rem; }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--gray-light); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 0.75rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 0.75rem 1.2rem; border-radius: 10px; font-size: 0.85rem; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 1000; display: flex; align-items: center; gap: 8px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    footer { text-align: center; padding: 2rem; color: var(--gray); font-size: 0.75rem; margin-top: 2rem; }
    footer a { color: var(--gold); text-decoration: none; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .table-header { display: none; }
      .proposal-row { grid-template-columns: 1fr; gap: 0.5rem; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">☀️</div><div class="logo-text"><span class="logo-name">Grupo Solarimob</span><span class="logo-sub">Portal de Propostas</span></div></div>
  <div class="header-right"><span id="last-update" style="font-size:0.75rem;color:rgba(255,255,255,0.5)"></span><button class="btn-nova" onclick="window.location.reload()">⟳ Atualizar</button></div>
</header>
<main>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total de Propostas</div><div class="stat-value" id="stat-total">—</div><div class="stat-sub">no portal</div></div>
    <div class="stat-card gold"><div class="stat-label">Este Mês</div><div class="stat-value" id="stat-mes">—</div><div class="stat-sub" id="stat-mes-label">em 2025</div></div>
    <div class="stat-card green"><div class="stat-label">Abertas</div><div class="stat-value" id="stat-abertas">—</div><div class="stat-sub">pelo cliente</div></div>
    <div class="stat-card warning"><div class="stat-label">Aguardando</div><div class="stat-value" id="stat-aguardando">—</div><div class="stat-sub">sem abertura</div></div>
  </div>
  <div class="toolbar">
    <span class="toolbar-title">📋 Propostas Enviadas</span>
    <div class="toolbar-right">
      <input class="search-input" type="text" placeholder="🔍 Buscar cliente..." oninput="filtrarPropostas(this.value)" id="search-input">
      <button class="filter-btn active" onclick="setFiltro('todos',this)">Todas</button>
      <button class="filter-btn" onclick="setFiltro('rapido',this)">Rápidas</button>
      <button class="filter-btn" onclick="setFiltro('completo',this)">Completas</button>
      <button class="filter-btn" onclick="setFiltro('abertas',this)">Abertas</button>
    </div>
  </div>
  <div class="proposals-table">
    <div class="table-header"><span>Cliente / Proposta</span><span>Tipo</span><span>Data</span><span>Status</span><span>Ações</span></div>
    <div id="proposals-body"><div class="loading"><div><div class="spinner"></div></div>Carregando propostas...</div></div>
  </div>
</main>
<footer>Portal de Propostas · <a href="https://www.solarimob.com.br" target="_blank">Grupo Solarimob</a> · Novo Hamburgo – RS</footer>
<div class="toast" id="toast"></div><script>
const REPO = 'gruposolarimob/solarimob-propostas';
const BASE_URL = 'https://gruposolarimob.github.io/solarimob-propostas';
let todasPropostas = [];
let filtroAtivo = 'todos';
function getTracking() { try { return JSON.parse(localStorage.getItem('solarimob_tracking') || '{}'); } catch { return {}; } }
function setTracking(filename, aberta) { const t = getTracking(); t[filename] = { aberta, em: new Date().toLocaleDateString('pt-BR') }; localStorage.setItem('solarimob_tracking', JSON.stringify(t)); }
function nomeAmigavel(filename) {
  const sem_ext = filename.replace('.html', '').replace('.HTML', '');
  const partes = sem_ext.split('_');
  let nome_partes = partes.slice(1);
  nome_partes = nome_partes.filter(p => !/^\d{6}$/.test(p));
  nome_partes = nome_partes.filter(p => !['rapido','completo','rapida','completa','rápido','rápida'].includes(p.toLowerCase()));
  return nome_partes.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ') || sem_ext;
}
function tipoProposal(filename) { const lower = filename.toLowerCase(); if (lower.includes('rapido') || lower.includes('rapida') || lower.includes('rápido')) return 'rapido'; return 'completo'; }
function extrairData(filename, githubDate) {
  const match = filename.match(/(\d{4})(\d{2})/);
  if (match) { const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return meses[parseInt(match[2])-1]+'/'+match[1]; }
  if (githubDate) return new Date(githubDate).toLocaleDateString('pt-BR',{month:'short',year:'numeric'});
  return '—';
}
function renderPropostas(propostas) {
  const container = document.getElementById('proposals-body');
  const tracking = getTracking();
  if (propostas.length === 0) { container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📂</div><h3>Nenhuma proposta encontrada</h3><p>Use o assistente Cowork para gerar sua próxima proposta. Ela aparecerá aqui automaticamente!</p></div>`; return; }
  container.innerHTML = propostas.map(p => {
    const tipo = tipoProposal(p.name), nome = nomeAmigavel(p.name), data = extrairData(p.name,p.githubDate);
    const url = `${BASE_URL}/${p.name}`, track = tracking[p.name] || {}, aberta = track.aberta || false;
    return `<div class="proposal-row" data-name="${p.name.toLowerCase()}" data-tipo="${tipo}" data-aberta="${aberta}">
      <div><div class="prop-name">${nome}</div><div class="prop-file">${p.name}</div></div>
      <div><span class="badge badge-${tipo}">${tipo==='rapido'?'⚡ Rápida':'📋 Completa'}</span></div>
      <div class="col-date">${data}</div>
      <div><span class="badge ${aberta?'badge-aberto':'badge-nao-aberto'}" id="status-${p.name}">${aberta?'✅ Aberta':'⏳ Aguardando'}</span>${aberta?`<div style="font-size:0.68rem;color:var(--gray);margin-top:3px;">em ${track.em||''}</div>`:''}</div>
      <div class="col-actions"><a class="action-btn btn-link" href="${url}" target="_blank">🔗 Abrir</a><button class="action-btn btn-copy" onclick="copiarLink('${url}','${nome}')">📋 Copiar</button>${!aberta?`<button class="action-btn btn-mark" onclick="marcarAberta('${p.name}','${nome}')">✓ Marcar aberta</button>`:''}</div>
    </div>`;
  }).join('');
  const tracking2 = getTracking(), abertas = propostas.filter(p => tracking2[p.name]?.aberta).length, agora = new Date();
  const mesAtual = propostas.filter(p => { const m=p.name.match(/(\d{4})(\d{2})/); return m&&parseInt(m[1])===agora.getFullYear()&&parseInt(m[2])===(agora.getMonth()+1); }).length;
  document.getElementById('stat-total').textContent=propostas.length;
  document.getElementById('stat-mes').textContent=mesAtual;
  document.getElementById('stat-mes-label').textContent=`em ${agora.toLocaleDateString('pt-BR',{month:'long'})}`;
  document.getElementById('stat-abertas').textContent=abertas;
  document.getElementById('stat-aguardando').textContent=propostas.length-abertas;
  document.getElementById('last-update').textContent=`Atualizado às ${agora.getHours()}:${String(agora.getMinutes()).padStart(2,'0')}`;
}
async function carregarPropostas() {
  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/`,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const files = await resp.json();
    todasPropostas = files.filter(f=f.name.startsWith('proposta_')&&f.name.endsWith('.html')).map(f=>({name:f.name,githubDate:f.lastModified})).reverse();
    renderPropostas(todasPropostas);
  } catch (e) { document.getElementById('proposals-body').innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>Erro ao carregar propostas</h3><p>${e.message}</p></div>`; }
}
function filtrarPropostas(busca) { document.querySelectorAll('.proposal-row').forEach(row=>{ const tipoOk=filtroAtivo==='todos'||row.dataset.tipo===filtroAtivo||(filtroAtivo==='abertas'&&row.dataset.aberta==='true'); const buscaOk=!busca||row.dataset.name.includes(busca.toLowerCase()); row.style.display=(tipoOk&&buscaOk)?'':'none';}); }
function setFiltro(tipo,btn) { filtroAtivo=tipo; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); filtrarPropostas(document.getElementById('search-input').value); }
function copiarLink(url,nome) { navigator.clipboard.writeText(url).then(()=>showToast(`✅ Link de "${nome}" copiado!`)).catch(()=>prompt('Copie o link abaixo:',url)); }
function marcarAberta(filename,nome) { setTracking(filename,true); showToast(`✅ "${nome}" marcada como aberta`); const el=document.getElementById(`status-${filename}`); if(el){el.className='badge badge-aberto';el.textContent='✅ Aberta';} const abertas=todasPropostas.filter(p=>getTracking()[p.name]?.aberta).length; document.getElementById('stat-abertas').textContent=abertas; document.getElementById('stat-aguardando').textContent=todasPropostas.length-abertas; }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
carregarPropostas();
</script>
</body></html>
